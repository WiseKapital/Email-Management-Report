name: Deliverability_Update_Action

on:
  schedule:
    # 3 intentos escalonados (3:17 AM, 5:37 AM y 7:43 AM hora Colombia)
    - cron: '17 8 * * *'
    - cron: '37 10 * * *'
    - cron: '43 12 * * *'
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha opcional (YYYY-MM-DD). Vacío = AYER (ej: 2026-11-15).'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar si el CSV de ayer ya existe (solo en schedule)
        id: check
        if: github.event_name == 'schedule'
        run: |
          YEAR=$(TZ='America/Bogota' date -d 'yesterday' +%Y)
          MONTH=$(LC_ALL=C TZ='America/Bogota' date -d 'yesterday' +%B | tr '[:upper:]' '[:lower:]')
          DAY_PAD=$(TZ='America/Bogota' date -d 'yesterday' +%d)
          DAY_RAW=$(TZ='America/Bogota' date -d 'yesterday' +%-d)
          DIR="${YEAR}/maildata/maildata_${MONTH}"
          if [ -f "${DIR}/${DAY_PAD}.csv" ] || [ -f "${DIR}/${DAY_RAW}.csv" ]; then
            echo "CSV de ayer ya existe en ${DIR}, saltando intento extra."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: Instalar dependencias
        if: steps.check.outputs.skip != 'true'
        run: npm install geoip-lite --no-save

      - name: Generar CSV diario en carpeta año/maildata/maildata_mes
        if: steps.check.outputs.skip != 'true'
        env:
          MJ_KEY_1: ${{ secrets.MLJ1 }}
          MJ_SECRET_1: ${{ secrets.MLJ1_SECRET }}
          MJ_KEY_2: ${{ secrets.MLJ2 }}
          MJ_SECRET_2: ${{ secrets.MLJ2_SECRET }}
          MJ_KEY_3: ${{ secrets.MLJSH }}
          MJ_SECRET_3: ${{ secrets.MLJSH_SECRET }}
          SG_KEY_1: ${{ secrets.SEG }}
          SG_KEY_2: ${{ secrets.SEGSH }}
          GODADDY_WEBHOOK_URL: ${{ secrets.GODADDY_WEBHOOK_URL }}
          FECHA_MANUAL: ${{ github.event.inputs.fecha }}
        run: node Deliverability_Update.js

      - name: Guardar CSV en Git
        if: steps.check.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add [0-9][0-9][0-9][0-9]/
          git commit -m "CSV diario (${{ github.event.inputs.fecha || 'ayer' }}) [skip ci]" || exit 0
          git push

      - name: Limpiar logs ya guardados en GoDaddy
        if: steps.check.outputs.skip != 'true'
        env:
          GODADDY_WEBHOOK_URL: ${{ secrets.GODADDY_WEBHOOK_URL }}
        run: |
          if [ -n "$GODADDY_WEBHOOK_URL" ]; then
            SEP="?"
            if [[ "$GODADDY_WEBHOOK_URL" == *"?"* ]]; then
              SEP="&"
            fi
            FECHA="${{ github.event.inputs.fecha }}"
            if [ -z "$FECHA" ]; then
              FECHA=$(TZ='America/Bogota' date -d 'yesterday' +%Y-%m-%d)
            fi
            echo "Limpiando logs en GoDaddy hasta $FECHA..."
            curl -fsS -4 --http1.1 --connect-timeout 10 --max-time 20 -A "Mozilla/5.0" "${GODADDY_WEBHOOK_URL}${SEP}borrar=${FECHA}" || echo "Aviso: GoDaddy no respondio"
          fi
