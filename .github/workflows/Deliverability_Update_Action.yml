name: Deliverability_Update_Action

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha opcional (YYYY-MM-DD). Vacío = AYER (ej: 2026-11-15).'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install geoip-lite --no-save

      - name: Generar CSV diario en carpeta año/maildata/maildata_mes
        env:
          MJ_KEY_1: ${{ secrets.MLJ1 }}
          MJ_SECRET_1: ${{ secrets.MLJ1_SECRET }}
          MJ_KEY_2: ${{ secrets.MLJ2 }}
          MJ_SECRET_2: ${{ secrets.MLJ2_SECRET }}
          MJ_KEY_3: ${{ secrets.MLJSH }}
          MJ_SECRET_3: ${{ secrets.MLJSH_SECRET }}
          SG_KEY_1: ${{ secrets.SEG }}
          SG_KEY_2: ${{ secrets.SEGSH }}
          CLOUDFLARE_WEBHOOK_URL: ${{ secrets.CLOUDFLARE_WEBHOOK_URL }}
          FECHA_MANUAL: ${{ github.event.inputs.fecha }}
        run: node Deliverability_Update.js

      - name: Guardar CSV en Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add [0-9][0-9][0-9][0-9]/
          git commit -m "CSV diario (${{ github.event.inputs.fecha || 'ayer' }}) [skip ci]" || exit 0
          git push

      - name: Limpiar logs ya guardados en Cloudflare D1
        env:
          CLOUDFLARE_WEBHOOK_URL: ${{ secrets.CLOUDFLARE_WEBHOOK_URL }}
        run: |
          if [ -n "$CLOUDFLARE_WEBHOOK_URL" ]; then
            SEP="?"
            if [[ "$CLOUDFLARE_WEBHOOK_URL" == *"?"* ]]; then
              SEP="&"
            fi
            FECHA="${{ github.event.inputs.fecha }}"
            if [ -z "$FECHA" ]; then
              FECHA=$(TZ='America/Bogota' date -d 'yesterday' +%Y-%m-%d)
            fi
            echo "Limpiando logs en Cloudflare D1 hasta $FECHA..."
            curl -fsS -4 --http1.1 --connect-timeout 10 --max-time 20 -A "Mozilla/5.0" "${CLOUDFLARE_WEBHOOK_URL}${SEP}borrar=${FECHA}" || echo "Aviso: Cloudflare no respondio"
          fi
