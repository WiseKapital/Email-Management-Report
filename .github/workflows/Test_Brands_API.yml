name: Test_Brands_API
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ver titulos Mailjet por NL y lista de codigos en las 5 cuentas
        env:
          MJ_KEY_1: ${{ secrets.MLJ1 }}
          MJ_SECRET_1: ${{ secrets.MLJ1_SECRET }}
          MJ_KEY_2: ${{ secrets.MLJ2 }}
          MJ_SECRET_2: ${{ secrets.MLJ2_SECRET }}
          MJ_KEY_3: ${{ secrets.MLJSH }}
          MJ_SECRET_3: ${{ secrets.MLJSH_SECRET }}
          SG_KEY_1: ${{ secrets.SEG }}
          SG_KEY_2: ${{ secrets.SEGSH }}
        run: |
          node -e '
          const f = async (u, h) => {
            try {
              const r = await fetch(u, { headers: h, signal: AbortSignal.timeout(15000) });
              return { st: r.status, j: await r.json().catch(() => null) };
            } catch (e) { return { st: 0, err: e.message }; }
          };
          const mj = async (name, k, s) => {
            if (!k || !s) return;
            const h = { Authorization: "Basic " + Buffer.from(`${k}:${s}`).toString("base64") };
            const m = await f("https://api.mailjet.com/v3/REST/message?FromTS=2026-11-20T05:00:00Z&ToTS=2026-11-27T05:00:00Z&Limit=500", h);
            const cids = [...new Set((m.j?.Data || []).map(x => x.CampaignID).filter(id => id && id > 0))];
            const titles = [];
            for (const cid of cids.slice(0, 12)) {
              const c = await f(`https://api.mailjet.com/v3/REST/campaign/${cid}`, h);
              const nl = c.j?.Data?.[0]?.NewsLetterID;
              let t = null;
              if (nl) {
                const cd = await f(`https://api.mailjet.com/v3/REST/campaigndraft/${nl}`, h);
                const nlr = await f(`https://api.mailjet.com/v3/REST/newsletter/${nl}`, h);
                t = { cid, nl, draftTitle: cd.j?.Data?.[0]?.Title, nlTitle: nlr.j?.Data?.[0]?.Title, subj: c.j?.Data?.[0]?.Subject };
              }
              titles.push(t || { cid, subj: c.j?.Data?.[0]?.Subject });
            }
            console.log(`${name} (${cids.length} camps):`, JSON.stringify(titles));
          };
          const sg = async (name, k) => {
            if (!k) return;
            const h = { Authorization: `Bearer ${k}` };
            const ss = await f("https://api.sendgrid.com/v3/marketing/singlesends?page_size=40", h);
            console.log(`${name} singlesends:`, JSON.stringify((ss.j?.result || []).filter(x => x.status === "triggered").map(x => x.name)));
          };
          (async () => {
            await mj("MLJ1", process.env.MJ_KEY_1, process.env.MJ_SECRET_1);
            await mj("MLJ2", process.env.MJ_KEY_2, process.env.MJ_SECRET_2);
            await mj("MLJ_SH", process.env.MJ_KEY_3, process.env.MJ_SECRET_3);
            await sg("SEG1", process.env.SG_KEY_1);
            await sg("SEG2", process.env.SG_KEY_2);
          })();
          '
