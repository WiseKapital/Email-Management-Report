name: Test_Brands_API
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar enlace de campañas Mailjet y stats de Single Sends SendGrid
        env:
          MJ_KEY_1: ${{ secrets.MLJ1 }}
          MJ_SECRET_1: ${{ secrets.MLJ1_SECRET }}
          MJ_KEY_2: ${{ secrets.MLJ2 }}
          MJ_SECRET_2: ${{ secrets.MLJ2_SECRET }}
          MJ_KEY_3: ${{ secrets.MLJSH }}
          MJ_SECRET_3: ${{ secrets.MLJSH_SECRET }}
          SG_KEY_1: ${{ secrets.SEG }}
          SG_KEY_2: ${{ secrets.SEGSH }}
        run: |
          node -e '
          const f = async (u, h) => {
            try {
              const r = await fetch(u, { headers: h, signal: AbortSignal.timeout(15000) });
              const t = await r.text();
              try { return { ok: r.ok, st: r.status, j: JSON.parse(t) }; } catch { return { ok: r.ok, st: r.status, raw: t.slice(0, 200) }; }
            } catch (e) { return { ok: false, err: e.message }; }
          };
          const mj = async (name, k, s) => {
            if (!k || !s) return;
            const h = { Authorization: "Basic " + Buffer.from(`${k}:${s}`).toString("base64") };
            console.log(`\n=== ${name} ===`);
            const ov = await f("https://api.mailjet.com/v3/REST/campaignoverview?Limit=10", h);
            console.log("overview:", ov.st, JSON.stringify((ov.j?.Data || []).slice(0, 10).map(x => ({ id: x.ID, idType: x.IDType, title: x.Title, subj: x.Subject, sendAt: x.SendTimeStart }))));
            const m = await f("https://api.mailjet.com/v3/REST/message?FromTS=2026-11-25T05:00:00Z&ToTS=2026-11-27T05:00:00Z&Limit=20&ShowSubject=true", h);
            const campIds = [...new Set((m.j?.Data || []).map(x => x.CampaignID).filter(id => id && id > 0))];
            console.log("recent campIds:", campIds.slice(0, 5));
            for (const cid of campIds.slice(0, 2)) {
              const c1 = await f(`https://api.mailjet.com/v3/REST/campaign/${cid}`, h);
              const c2 = await f(`https://api.mailjet.com/v3/REST/campaigndraft?Campaign=${cid}`, h);
              console.log(`camp ${cid}:`, c1.st, JSON.stringify(c1.j?.Data?.[0] ? { subj: c1.j.Data[0].Subject, nl: c1.j.Data[0].NewsLetterID, custom: c1.j.Data[0].CustomValue } : c1.j), "draft:", c2.st, JSON.stringify((c2.j?.Data || []).map(x => ({ title: x.Title, subj: x.Subject }))));
            }
          };
          const sg = async (name, k) => {
            if (!k) return;
            const h = { Authorization: `Bearer ${k}` };
            console.log(`\n=== ${name} ===`);
            const ss = await f("https://api.sendgrid.com/v3/marketing/singlesends?page_size=15", h);
            const list = (ss.j?.result || []).map(x => ({ id: x.id, name: x.name, st: x.status, at: x.send_at }));
            console.log("singlesends:", ss.st, JSON.stringify(list.slice(0, 10)));
            const allSt = await f("https://api.sendgrid.com/v3/marketing/stats/singlesends?page_size=10", h);
            console.log("all singlesends stats:", allSt.st, JSON.stringify((allSt.j?.results || []).slice(0, 5)));
            const trg = list.find(x => x.st === "triggered");
            if (trg) {
              const one = await f(`https://api.sendgrid.com/v3/marketing/stats/singlesends/${trg.id}?aggregated_by=day&start_date=2026-11-20&end_date=2026-11-27`, h);
              console.log(`one (${trg.name}):`, one.st, JSON.stringify(one.j));
            }
          };
          (async () => {
            await mj("MLJ1", process.env.MJ_KEY_1, process.env.MJ_SECRET_1);
            await mj("MLJ2", process.env.MJ_KEY_2, process.env.MJ_SECRET_2);
            await mj("MLJ_SH", process.env.MJ_KEY_3, process.env.MJ_SECRET_3);
            await sg("SEG1", process.env.SG_KEY_1);
            await sg("SEG2", process.env.SG_KEY_2);
          })();
          '
